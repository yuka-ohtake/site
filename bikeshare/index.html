<div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 24px;">

<script>
// ⭐【初期のお気に入り設定】
const DEFAULT_FAVORITE_STATIONS = {
   "11687": "<img src='book1.png' alt='book1' class='icon-img'> TAU東門",
    "3369": "<img src='book2.png' alt='book2' class='icon-img'> MAUから5分",
    "11177": "<img src='book3.png' alt='book3' class='icon-img'> TUFS"}; 


const HELLO_CYCLING_STATUS_URL = "https://api-public.odpt.org/api/v4/gbfs/hellocycling/station_status.json";
const HELLO_CYCLING_INFO_URL = "https://api-public.odpt.org/api/v4/gbfs/hellocycling/station_information.json";

let combinedStationMap = new Map();

function getFavoriteStations() {
    const saved = localStorage.getItem('MY_FAVORITE_STATIONS');
    if (saved) {
        try {
            return JSON.parse(saved);
        } catch (e) {
            return DEFAULT_FAVORITE_STATIONS;
        }
    }
    return DEFAULT_FAVORITE_STATIONS;
}

function saveFavoriteStations(stations) {
    localStorage.setItem('MY_FAVORITE_STATIONS', JSON.stringify(stations));
}

function addStationFromInput() {
    const idInput = document.getElementById('new-station-id');
    const memoInput = document.getElementById('new-station-memo');
    const errorDiv = document.getElementById('add-error-msg');
    
    const id = idInput.value.trim();
    const memo = memoInput.value.trim();

    errorDiv.style.display = 'none';

    if (!id) {
        errorDiv.textContent = 'ステーションIDを入力してください。';
        errorDiv.style.display = 'block';
        return;
    }

    if (!/^\d+$/.test(id)) {
        errorDiv.textContent = 'ステーションIDは半角数字で入力してください。';
        errorDiv.style.display = 'block';
        return;
    }

    executeAddStation(id, memo || `No. ${id}`);
    
    idInput.value = '';
    memoInput.value = '';
}

function executeAddStation(id, memo) {
    const currentStations = getFavoriteStations();
    currentStations[id] = memo;
    saveFavoriteStations(currentStations);
    
    document.getElementById('search-result-container').innerHTML = '';
    document.getElementById('station-search-input').value = '';
    renderCyclingStatus();
}

function deleteStation(id) {
    if (confirm(`No. ${id} をお気に入りから削除しますか？`)) {
        const currentStations = getFavoriteStations();
        delete currentStations[id];
        saveFavoriteStations(currentStations);
        renderCyclingStatus();
    }
}

function searchOnlineStation() {
    const query = document.getElementById('station-search-input').value.trim().toLowerCase();
    const resultContainer = document.getElementById('search-result-container');
    
    if (!query) {
        resultContainer.innerHTML = '<span style="color:#e53e3e; font-size:13px;">検索キーワードまたはIDを入力してください。</span>';
        return;
    }

    if (combinedStationMap.size === 0) {
        resultContainer.innerHTML = '<span style="color:#e53e3e; font-size:13px;">最新データがまだ読み込まれたいません。数秒後に再度お試しください。</span>';
        return;
    }

    const matchedStations = [];
    const favorites = getFavoriteStations();

    for (const [id, station] of combinedStationMap.entries()) {
        const name = (station.name || "").toLowerCase();
        const address = (station.address || "").toLowerCase();
        
        if (id.includes(query) || name.includes(query) || address.includes(query)) {
            matchedStations.push(station);
            if (matchedStations.length >= 30) break;
        }
    }

    if (matchedStations.length === 0) {
        resultContainer.innerHTML = '<span style="color:#e53e3e; font-size:13px;">該当するステーションが見つかりませんでした。</span>';
        return;
    }

    let resultHtml = `<p style="font-size:12px; color:gray; margin:0 0 8px 0;">検索結果: ${matchedStations.length}件（上位30件まで表示）</p>`;
    
    matchedStations.forEach(station => {
        const id = station.cleanId;
        const nameText = station.name || `ステーション No.${id}`;
        
        if (favorites[id]) {
            resultHtml += `
                <div class="search-result-item" style="background:#f0fff4; border-color:#c6f6d5; color:#2f855a;">
                    <div><strong>ID ${id}: ${nameText}</strong><br><span style="font-size:11px;">お気に入り登録済み（${favorites[id]}）</span></div>
                </div>
            `;
        } else {
            resultHtml += `
                <div class="search-result-item">
                    <div style="padding-right: 8px;">
                        <strong>ID ${id}: ${nameText}</strong><br>
                        <span style="color:#718096; font-size:11px;">🚲 貸出: ${station.bikes}台 / <span class="lemon-text">▶︎</span> 返却: ${station.docks}枠</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:4px;">
                        <input type="text" id="memo-input-${id}" placeholder="メモ（任意）" value="${nameText}" style="padding: 4px 6px; border: 1px solid #cbd5e0; border-radius: 4px; font-size:11px; width:100px;">
                        <button class="add-search-btn" onclick="executeAddStation('${id}', document.getElementById('memo-input-${id}').value.trim() || '${nameText}')">追加</button>
                    </div>
                </div>
            `;
        }
    });

    resultContainer.innerHTML = resultHtml;
}

async function renderCyclingStatus() {
    const tableContainer = document.getElementById('cycling-table-container');
    const visualContainer = document.getElementById('cycling-visual-container');
    
    try {
        const [resStatus, resInfo] = await Promise.all([
            fetch(HELLO_CYCLING_STATUS_URL),
            fetch(HELLO_CYCLING_INFO_URL)
        ]);

        if (!resStatus.ok || !resInfo.ok) throw new Error("データのダウンロードに失敗しました");
        
        const [statusData, infoData] = await Promise.all([
            resStatus.json(),
            resInfo.json()
        ]);

        const statusList = statusData.data.stations;
        const infoList = infoData.data.stations;

        combinedStationMap.clear();
        
        infoList.forEach(info => {
            const cleanId = String(info.station_id).replace('st_', '');
            combinedStationMap.set(cleanId, {
                cleanId: cleanId,
                name: info.name,
                address: info.address,
                bikes: 0,
                docks: 0
            });
        });

        statusList.forEach(status => {
            const cleanId = String(status.station_id).replace('st_', '');
            if (combinedStationMap.has(cleanId)) {
                const target = combinedStationMap.get(cleanId);
                target.bikes = status.num_bikes_available;
                target.docks = status.num_docks_available;
            } else {
                combinedStationMap.set(cleanId, {
                    cleanId: cleanId,
                    name: "",
                    address: "",
                    bikes: status.num_bikes_available,
                    docks: status.num_docks_available
                });
            }
        });
        
        const favorites = getFavoriteStations();
        const favoriteIds = Object.keys(favorites);

        if (favoriteIds.length === 0) {
            visualContainer.innerHTML = '<p style="color:gray">お気に入りに登録されたステーションはありません。</p>';
            tableContainer.innerHTML = '';
            return;
        }

        // 横棒グラフ（ビジュアル）の生成
        let visualHtml = '<div class="bike-card-container">';
        favoriteIds.forEach(id => {
            const station = combinedStationMap.get(id);
            if (!station) return;

            const memoText = favorites[id] || `No. ${id}`;
            const bikes = station.bikes;
            const docks = station.docks;
            const total = bikes + docks;
            const bikePercentage = total > 0 ? (bikes / total) * 100 : 0;
            const bikeClass = bikes === 0 ? "bike-count zero" : "bike-count active";
            const dockClass = docks === 0 ? "bike-count zero" : "bike-count";

            visualHtml += `
                <div class="bike-card">
                    <div class="bike-card-header">
                        <span class="bike-station-name">${memoText}</span>
                        <span class="bike-station-no">ID: ${id}</span>
                    </div>
                    <div class="bike-gauge-track">
                        <div class="bike-gauge-fill" style="width: ${bikePercentage}%;"></div>
                    </div>
                    <div class="bike-card-footer">
                        <span><img src="cycle.png" alt="cycle" class="icon-img"> 貸出可: <span class="${bikeClass}">${bikes}台</span></span>                        <span><span class="lemon-text">▶︎</span> 返却空き: <span class="${dockClass}">${docks}枠</span></span>
                    </div>
                </div>
            `;
        });
        visualHtml += '</div>';
        visualContainer.innerHTML = visualHtml;

        // 表（テーブル）の生成
        let tableHtml = '<table border="1" style="border-collapse: collapse; width: 100%; text-align: center; border-color: #e2e8f0; margin-top: 16px; background-color: #ffffff;">';
        tableHtml += '<tr style="background-color: #f7fafc;"><th>ステーションNo</th><th>貸出可</th><th>返却可</th><th>操作</th></tr>';

        favoriteIds.forEach(id => {
            const station = combinedStationMap.get(id);
            const memoText = favorites[id] || "";
            
            if (station) {
                const bikes = station.bikes;
                const docks = station.docks;
                const bikeColor = bikes === 0 ? '#ff1493' : '#4169e1';
                const dockColor = docks === 0 ? '#ff1493' : 'black';

                tableHtml += `
                    <tr>
                        <td style="padding: 10px 5px;">
                            <strong>No. ${id}</strong><br>
                            <span style="font-size: 11px; color: #666;">${memoText}</span>
                        </td>
                        <td style="color: ${bikeColor}; font-weight: bold;">${bikes} 台</td>
                       <td style="color: ${dockColor};">${docks} 枠</td>
                        <td>
                            <button class="delete-btn" onclick="deleteStation('${id}')">削除</button>
                        </td>
                    </tr>
                `;
            } else {
                tableHtml += `
                    <tr>
                        <td style="padding: 10px 5px; color: #a0aec0;">
                            <strong>No. ${id}</strong><br>
                            <span style="font-size: 11px; color: #666;">${memoText}</span>
                        </td>
                        <td colspan="2" style="color: #a0aec0; font-size: 12px;">実在しないID、またはデータ未反映です</td>
                        <td>
                            <button class="delete-btn" onclick="deleteStation('${id}')">削除</button>
                        </td>
                    </tr>
                `;
            }
        });

        const currentTimeString = new Date().toLocaleTimeString();
        tableHtml += '</table>';
        tableHtml += `<p style="font-size: 12px; color: gray; text-align: right;">公式リアルタイムデータ同期時刻: ${currentTimeString} (30秒ごとに自動更新中)</p>`;
        tableContainer.innerHTML = tableHtml;

    } catch (error) {
        visualContainer.innerHTML = `<p style="color:red">公式データの取得に失敗しました。<br><small>理由: インターネット接続を確認するか、しばらく時間をおいてください。(${error.message})</small></p>`;
    }
}

renderCyclingStatus();
setInterval(renderCyclingStatus, 30000);
</script>
